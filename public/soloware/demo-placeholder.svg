<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Demo coming soon">
  <style>
    .pane { fill: #f8f4e9; stroke: #9b937a; stroke-width: 1; opacity: .55; }
    .dot { fill: #8a7658; opacity: .45; animation: wander 7s ease-in-out infinite; }
    @keyframes wander { 0%,100% { transform: translate(70px,70px) } 30% { transform: translate(190px,85px) } 55% { transform: translate(175px,140px) } 80% { transform: translate(100px,120px) } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; transform: translate(130px,95px); } }
  </style>
  <rect width="320" height="200" fill="#e3decf"/>
  <rect class="pane" x="38" y="28" width="72" height="144" rx="2"/>
  <rect class="pane" x="118" y="28" width="164" height="44" rx="2"/>
  <rect class="pane" x="118" y="78" width="164" height="44" rx="2"/>
  <rect class="pane" x="118" y="128" width="164" height="44" rx="2"/>
  <circle class="dot" r="5"/>
</svg>
